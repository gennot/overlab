# Prova della fonte ESPN (gratuita, senza chiave): scarica alcuni esempi e li salva nel ramo espn-campioni.
name: Prova ESPN
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica esempi
        run: |
          set +e
          mkdir -p out && cd out
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          g() { curl -sS -m 30 -A "Mozilla/5.0" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> codes.txt; }
          g all_lim_20261121.json "$S/all/scoreboard?dates=20261121&limit=1000"
          g all_lim_20261108.json "$S/all/scoreboard?dates=20261108&limit=1000"
          g all_summary.json "$S/all/summary?event=401879233"
          g eng1_summary.json "$S/eng.1/summary?event=401879233"
          g eng1_range.json "$S/eng.1/scoreboard?dates=20261101-20261130"
          g eng6_sb.json "$S/eng.6/scoreboard?dates=20261122"
          g ita3_sb.json "$S/ita.3/scoreboard?dates=20261122"
          g eng1_cal.json "$S/eng.1/scoreboard"
          ls -la
      - name: Salva nel ramo espn-campioni
        run: |
          cd out
          git init -q && git checkout -q -b espn-campioni
          git config user.name "overlab-bot" && git config user.email "overlab-bot@users.noreply.github.com"
          git add . && git commit -qm "Esempi ESPN"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" espn-campioni
