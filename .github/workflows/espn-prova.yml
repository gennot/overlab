# Prova della fonte ESPN (gratuita, senza chiave): scarica alcuni esempi e li salva nel ramo espn-campioni.
name: Prova ESPN
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica esempi
        run: |
          set +e
          mkdir -p out && cd out
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          g() { curl -sS -m 30 -A "Mozilla/5.0" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> codes.txt; }
          curl -sS -m 20 -D cors_sb.txt -o /dev/null -H "Origin: https://gennot.github.io" "$S/all/scoreboard?dates=20261126&limit=1000"
          curl -sS -m 20 -D cors_sum.txt -o /dev/null -H "Origin: https://gennot.github.io" "$S/all/summary?event=401879233"
          curl -sS -m 20 -D cors_pre.txt -o /dev/null -X OPTIONS -H "Origin: https://gennot.github.io" -H "Access-Control-Request-Method: GET" "$S/all/scoreboard"
          ls -la
      - name: Salva nel ramo espn-campioni
        run: |
          cd out
          git init -q && git checkout -q -b espn-campioni
          git config user.name "overlab-bot" && git config user.email "overlab-bot@users.noreply.github.com"
          git add . && git commit -qm "Esempi ESPN"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" espn-campioni
