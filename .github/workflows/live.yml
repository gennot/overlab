# Risultati in diretta: ogni 5 minuti (GitHub a volte ritarda di qualche minuto) scrive live.json sul ramo "live".
# L'app lo legge da raw.githubusercontent.com; nessun altro servizio, la chiave API resta nei segreti del repository.
name: Risultati live
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/live.yml', 'pipeline/live.js']
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            store/state.json
          sparse-checkout-cone-mode: false
      - name: Scarica i risultati
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node pipeline/live.js
      - name: Pubblica live.json sul ramo "live"
        run: |
          cd live
          git init -q -b live
          git config user.name "overlab-bot"
          git config user.email "overlab-bot@users.noreply.github.com"
          git add live.json
          git commit -q -m "Risultati live"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live
