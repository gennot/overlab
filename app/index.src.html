<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OverLab</title>
<meta name="description" content="Pronostici statistici su tiri, tiri in porta, corner, falli e cartellini per squadre e giocatori.">
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OverLab">
<link rel="apple-touch-icon" href="data:image/png;base64,/*ICON*/">
<link rel="icon" href="data:image/png;base64,/*ICON*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&family=Saira+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Impianto: app da telefono con barra di navigazione in basso, striscia dei giorni e partite raggruppate per campionato.
   Grafite scura, accento "erba" che sfuma dal verde all'acqua, oro solo per le occasioni. Titoli stretti e pesanti da tabellone. */
:root{
  --bg:#111214;--surface:#1a1c1f;--surface2:#24272b;--line:#2d3136;--fg:#f2f4f5;--muted:#8b9299;
  --g1:#2fd47f;--g2:#16b5c6;--on-grad:#04231a;--grad:linear-gradient(120deg,var(--g1),var(--g2));
  --accent:#25c584;--accent-fg:#04231a;--accent-ink:#52e3a0;--accent-bg:rgba(37,197,132,.13);--gold:#f3b63f;
  --hi:#3ccf8a;--ok:#a6d66e;--mid:#f1b648;--lo:#858d98;--err:#ff8a78;
  --hi-bg:rgba(60,207,138,.13);--ok-bg:rgba(166,214,110,.11);--mid-bg:rgba(241,182,72,.11);--lo-bg:rgba(133,141,152,.10);
  --pitch:rgba(82,227,160,.07);--shadow:0 10px 30px rgba(0,0,0,.45);--glow:0 8px 24px rgba(37,197,132,.28);
  --pro1:#ffd77f;--pro2:#f5a524;--home:#16b5c6;--home-ink:#4fd8e6;--away:#ff6a3d;--away-ink:#ff8f63;
  --disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;--num:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--pro1:#c47a00;--pro2:#9a5a00;--home-ink:#0b8796;--away-ink:#d4461e;
  --bg:#f3f4f5;--surface:#ffffff;--surface2:#eef0f2;--line:#dfe2e6;--fg:#121417;--muted:#5d646d;
  --g1:#14b46b;--g2:#0e9fb3;--on-grad:#ffffff;
  --accent:#0f9e66;--accent-fg:#ffffff;--accent-ink:#0a8454;--accent-bg:rgba(15,158,102,.10);--gold:#b7791f;
  --hi:#0e8a55;--ok:#4e8a1e;--mid:#a86a00;--lo:#66707c;--err:#b3261e;
  --hi-bg:rgba(14,138,85,.10);--ok-bg:rgba(78,138,30,.09);--mid-bg:rgba(168,106,0,.09);--lo-bg:rgba(102,112,124,.08);
  --pitch:rgba(15,158,102,.07);--shadow:0 8px 24px rgba(18,20,23,.10);--glow:0 8px 22px rgba(15,158,102,.25);
  color-scheme:light;
}}
:root[data-theme="light"]{--pro1:#c47a00;--pro2:#9a5a00;--home-ink:#0b8796;--away-ink:#d4461e;
  --bg:#f3f4f5;--surface:#ffffff;--surface2:#eef0f2;--line:#dfe2e6;--fg:#121417;--muted:#5d646d;
  --g1:#14b46b;--g2:#0e9fb3;--on-grad:#ffffff;
  --accent:#0f9e66;--accent-fg:#ffffff;--accent-ink:#0a8454;--accent-bg:rgba(15,158,102,.10);--gold:#b7791f;
  --hi:#0e8a55;--ok:#4e8a1e;--mid:#a86a00;--lo:#66707c;--err:#b3261e;
  --hi-bg:rgba(14,138,85,.10);--ok-bg:rgba(78,138,30,.09);--mid-bg:rgba(168,106,0,.09);--lo-bg:rgba(102,112,124,.08);
  --pitch:rgba(15,158,102,.07);--shadow:0 8px 24px rgba(18,20,23,.10);--glow:0 8px 22px rgba(15,158,102,.25);
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.top-in,.wrap{max-width:680px;margin:0 auto}
.top-in{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 26px/1 var(--disp);letter-spacing:.01em;text-transform:uppercase}
.brand i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{width:32px;height:32px;flex:none;display:block}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}
.top-in .sp{flex:1}
.ib{display:grid;place-items:center;width:40px;height:40px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ib .ic{width:20px;height:20px}
.ib:active{background:var(--surface2)}
.wrap{padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.selw{display:flex;flex-direction:column;gap:6px}
.selw span{font:600 12px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sel{font:600 16px/1.2 var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 14px/1 var(--body);padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.day{font:600 13px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 0;text-wrap:balance}
.day::first-letter{text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px}
.mt{width:100%;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 0;transition:border-color .15s}
.mt:hover{border-color:var(--accent)}
.mt:active{background:var(--surface2)}
.mt-t{align-self:stretch;display:grid;place-items:center;font:600 18px/1 var(--num);font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
.live{color:var(--err);font-size:14px}
.mt-n{display:flex;flex-direction:column;gap:6px;min-width:0;font-weight:500}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-c{font:600 11px/1.2 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-bg);border-radius:6px;padding:5px 7px;text-align:center;max-width:92px}
.lg{width:24px;height:24px;object-fit:contain;flex:none}
.lg.ph{border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font:700 9px/1 var(--disp);letter-spacing:.02em;color:var(--muted)}
.mh-t .lg.ph{font-size:15px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px;line-height:1.5}
.note.err{color:var(--err)}
.note.good{border-color:var(--hi);color:var(--fg)}
.note b{color:var(--fg)}
.foot{color:var(--muted);font-size:13px;margin:4px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--body);padding:13px 16px;border-radius:12px;border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.btn.pri{background:var(--grad);border-color:transparent;color:var(--on-grad);box-shadow:var(--glow)}
.btn.wide{align-self:stretch;text-align:center}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.back{display:inline-flex;align-items:center;gap:4px;font:600 15px/1 var(--body);color:var(--accent-ink);padding:6px 0;align-self:flex-start}
.mh{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:20px 10px;background:linear-gradient(90deg,transparent calc(50% - .5px),var(--pitch) calc(50% - .5px),var(--pitch) calc(50% + .5px),transparent calc(50% + .5px)),radial-gradient(circle at 50% 50%,transparent 46px,var(--pitch) 47px,var(--pitch) 48px,transparent 49px),var(--surface)}
.mh-t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.mh-t .lg{width:44px;height:44px}
.mh-t b{font:600 18px/1.1 var(--disp);letter-spacing:.01em;text-wrap:balance}
.mh-c{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;text-align:center}
.mh-c b{font:700 32px/1 var(--num);color:var(--fg);font-variant-numeric:tabular-nums}
.tabs,.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button,.seg button{display:flex;align-items:center;justify-content:center;gap:6px;font:600 14px/1 var(--body);padding:11px 6px;border-radius:9px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on,.seg.main button.on{background:var(--grad);color:var(--on-grad)}
.seg button.on{background:var(--surface2);color:var(--fg)}
.seg.small button{font-size:13px;padding:9px 4px}
.bar{height:4px;border-radius:2px;background:var(--surface2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pick.open{border-color:var(--accent)}
.pick.occ{border-color:var(--gold)}
.pick-b{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px}
.pick-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick-l b{font-weight:600;line-height:1.25}
.pick-l small{color:var(--muted);font-size:12.5px}
.pp{font:700 26px/1 var(--num);font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:10px;min-width:64px;text-align:center}
.hi{color:var(--hi);background:var(--hi-bg)}.ok{color:var(--ok);background:var(--ok-bg)}.mid{color:var(--mid);background:var(--mid-bg)}.lo{color:var(--lo);background:var(--lo-bg)}
.why{border-top:1px solid var(--line);padding:12px 14px;font-size:14px;color:var(--muted)}
.why>b{font:600 12px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.why ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.why li{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 0 6px}
.card h3{display:flex;align-items:center;gap:10px;font:700 18px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;margin:0 14px 8px}
.card h3 .ic{width:28px;height:28px;padding:5px;border-radius:8px;color:var(--accent-ink);background:var(--accent-bg)}
.trow{border-top:1px solid var(--line);padding:10px 0}
.trow-h{display:flex;justify-content:space-between;gap:10px;width:100%;padding:0 14px 8px;font-weight:600}
.exp{color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap}
.exp b{font:700 18px/1 var(--num);color:var(--fg)}
.lines{display:flex;gap:6px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.lines::-webkit-scrollbar{display:none}
.ln{flex:1 0 58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:9px}
.ln small{font-size:11px;color:var(--muted);white-space:nowrap}
.ln b{font:700 19px/1 var(--num);font-variant-numeric:tabular-nums}
.trow .why{margin-top:10px}
.qt{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums;font-size:13px}
.qt th{font:600 11px/1.2 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px}
.qt td{text-align:right;padding:5px 4px;border-top:1px solid var(--line);color:var(--fg)}
.qt th:first-child,.qt td:first-child{text-align:left}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.phead,.pl-r{display:grid;grid-template-columns:1fr 50px 50px 50px;gap:6px;align-items:center}
.phead{padding:10px 14px;font:600 12px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phead span:not(:first-child){text-align:center}
.pl{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.pl.out .pl-n b{color:var(--muted)}
.pl-n{display:flex;flex-direction:column;gap:2px;min-width:0}
.pl-n b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-n small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{font:700 17px/1 var(--num);font-variant-numeric:tabular-nums;text-align:center;padding:8px 0;border-radius:8px}
.stt{align-self:flex-start;font:600 12px/1 var(--body);padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stt.tit{border-color:var(--hi);color:var(--hi)}
.stt.pan{border-color:var(--mid);color:var(--mid)}
.stt.prob{border-style:dashed}
.od{display:block;font:600 11px/1.2 var(--body);color:var(--muted);letter-spacing:0}
.pc .od{margin-top:2px}
.ln.val,.pc.val{box-shadow:inset 0 0 0 1.5px var(--gold)}
.pp.od2{color:var(--fg);background:var(--surface2)}
.pp.od2.gold{color:var(--gold);background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--gold)}
.tag.gold{color:var(--gold);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--gold)}
.pick-l small b{font-weight:700}
.hit{color:var(--hi)}.okt{color:var(--ok)}.midt{color:var(--mid)}.lot{color:var(--lo)}
.wrapc{display:flex;flex-wrap:wrap;gap:8px}
.sbar{position:sticky;bottom:calc(82px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;background:var(--grad);color:var(--on-grad);border-radius:16px;padding:14px 16px;font:700 15px/1.2 var(--body);box-shadow:var(--glow);text-align:left;font-variant-numeric:tabular-nums}
.sbar>span:first-of-type{flex:1;min-width:0}
.sbar b{font-weight:700}
.recap{margin-top:-4px}
.recap a{color:var(--accent-ink);font-weight:600}
#slipres{display:flex;flex-direction:column;gap:12px;scroll-margin-top:70px}
.sett{scroll-margin-top:70px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dchip b{font:600 14px/1 var(--body);color:var(--fg)}
.dchip small{font:500 11.5px/1 var(--body);color:var(--muted)}
.dchip.on{background:var(--accent-bg);border-color:var(--accent)}
.dchip.on b,.dchip.on small{color:var(--accent-ink)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.bnav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 4px;color:var(--muted);font:600 11.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.bnav .ic{width:24px;height:24px}
.bnav button.on{color:var(--accent-ink)}
.bnav button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
.vh{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.vh h1{display:flex;align-items:center;gap:10px;margin:0;font:800 25px/1.05 var(--disp);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.vh h1 .ic{width:26px;height:26px;color:var(--accent-ink)}
.vh p{margin:0;color:var(--muted);font-size:14px}
.dstrip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 6px}
.dstrip::-webkit-scrollbar{display:none}
.dcard{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 11px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dcard small{font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase}
.dcard b{font:700 30px/1 var(--num);color:var(--fg);font-variant-numeric:tabular-nums}
.dcard i{font:500 11px/1 var(--body);font-style:normal}
.dcard.on{background:var(--grad);border-color:transparent;color:var(--on-grad);box-shadow:var(--glow)}
.dcard.on b,.dcard.on i,.dcard.on small{color:var(--on-grad)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;font:600 13px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:11px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-bg)}
.pill .ic{width:16px;height:16px}
.psel{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;padding:0 12px 0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.psel .ic{width:16px;height:16px;color:var(--accent-ink)}
.psel select{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--fg);font:600 13px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:11px 18px 11px 0;max-width:210px}
.psel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.count{color:var(--muted);font-size:13px;margin:0}
.lgrp{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lgh{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;text-align:left}
.lgh b{flex:1;min-width:0;font:700 15px/1.1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.lgh span{color:var(--muted);font:600 13px/1 var(--num)}
.lgh .ic{width:18px;height:18px;color:var(--muted);transition:transform .15s}
.lgrp.closed .lgh .ic{transform:rotate(-90deg)}
.lgrp.closed .mrow{display:none}
.mrow{display:grid;grid-template-columns:54px 1fr 18px;align-items:center;gap:12px;width:100%;padding:13px 14px 13px 16px;border-top:1px solid var(--line);text-align:left}
.mrow:active{background:var(--surface2)}
.mrow .tm{font:600 16px/1 var(--num);font-variant-numeric:tabular-nums;color:var(--fg)}
.mrow .tm.live{color:var(--err)}
.mrow .tn{display:flex;flex-direction:column;gap:9px;min-width:0;font:600 16px/1.15 var(--body)}
.mrow .ic{width:18px;height:18px;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}

<template id="info-tpl">
<div class="info">
<h2>Cosa fa</h2>
<p>Per ogni partita stima quante volte succede una cosa (gol, tiri, tiri in porta, corner, falli, cartellini gialli) e la trasforma in probabilità: risultato, doppia chance, goal/no goal, gol totali e ogni linea per squadre e singoli giocatori. Tra i pronostici propone solo over e «almeno», tranne falli e cartellini, dove ci sono anche gli under.</p>
<h2>Cosa guarda</h2>
<ul>
<li>Quanto produce la squadra e quanto concede l'avversaria, tenendo conto di chi hanno affrontato.</li>
<li>Stato di forma: le partite recenti pesano di più delle vecchie.</li>
<li>Casa o trasferta, con la media del campionato come riferimento.</li>
<li>Per i giocatori: che parte dei tiri e dei falli della squadra passa da lui quando è in campo, e quanti minuti dovrebbe giocare.</li>
<li>Formazioni: quelle ufficiali appena escono (circa un'ora prima), altrimenti quelle probabili. Se sai che uno non gioca, segnalo Assente e i numeri si aggiornano.</li>
</ul>
<h2>Quanto è affidabile</h2>
<p>Provato su 7.081 partite dei cinque grandi campionati (2022-2026) e poi su 26.396 partite di 18 campionati (Serie B, le quattro serie inglesi, Liga 2, 2. Bundesliga, Ligue 2, Olanda, Portogallo, Belgio, Turchia, Grecia, Scozia), usando ogni volta solo le partite precedenti. In tutti e 18 le percentuali tornano: quando dice circa 70% esce 69-70 volte su 100, quando dice circa 87% esce 86-89 volte. Poi l'ho rifatto sulle partite 2025-26 di tutti i 26 campionati dell'app: stesso risultato ovunque (circa 70% → tra 69 e 70 volte su 100), tranne le nazionali, dove i dati sono pochi e un 70% esce circa 68 volte.</p>
<table><tr><th>Il modello diceva</th><th>È successo</th></tr>
<tr><td>circa 28%</td><td>27,9%</td></tr><tr><td>circa 43%</td><td>42,6%</td></tr><tr><td>circa 57%</td><td>57,6%</td></tr><tr><td>circa 72%</td><td>71,5%</td></tr><tr><td>circa 87%</td><td>86,4%</td></tr></table>
<p>Giocatori, provato su 6.174 presenze da titolare in Premier League 2024-25: quando diceva circa 67% è successo il 66,8%, quando diceva circa 81% è successo l'81,9%.</p>
<p>Giocate che il modello dà sopra il 90%: uscite il 92% delle volte (30.899 casi). Sono linee basse e pagano poco.</p>
<p>Risultato: l'esito più probabile è uscito il 53% delle volte. Doppia chance sopra l'85%: uscita circa 9 volte su 10. Goal/no goal: il modello fa appena meglio di una moneta.</p>
<p>Giocatori senza formazione ufficiale: su 12.600 casi reali un titolare probabile è partito davvero titolare circa 2 volte su 3. Le percentuali ne tengono conto; se confermi tu il titolare salgono.</p>
<p>Un 70% vuol dire che 3 volte su 10 non esce. Cinque giocate al 90% messe insieme escono circa 6 volte su 10. Sono probabilità, non certezze.</p>
<h2>Quote</h2>
<p>L'app non usa le quote dei bookmaker: tutte le percentuali vengono dal modello. Accanto a ogni giocata c'è la <b>quota giusta</b>, cioè 1 diviso la probabilità (al 70% la quota giusta è 1,43). Se il tuo bookmaker paga più della quota giusta, secondo il modello la giocata conviene; se paga meno, il rischio non è pagato abbastanza.</p>
<h2>Pronostico principale e In evidenza</h2>
<p>Per ogni partita il pronostico principale è la giocata più probabile con quota giusta tra 1,40 e 2,50, scelta tra gol, risultato, gol delle squadre, tiri, corner e giocatori. Quando due giocate sono quasi alla pari vince quella sui gol, poi tiri, poi corner. «In evidenza» raccoglie il pronostico principale di tutte le partite, dal più probabile.</p>
<h2>Schedina IA</h2>
<p>Con «Sceglie l'IA» imposti periodo, tipo di giocata, obiettivo (una quota da raggiungere o una probabilità minima), quante partite e il budget: l'IA sceglie partite e linee. Con «Scelgo io» tocchi tu le partite e l'IA sceglie la giocata in ognuna. Usa solo giocate che secondo il modello escono almeno 6 volte su 10 e, a parità, preferisce meno partite. La quota della schedina è quella giusta: quella del bookmaker sarà un po' più bassa.</p>
<h2>Giocatori: cartellino e marcatore</h2>
<p>Il rischio giallo parte dai gialli che il giocatore prende ogni 90 minuti, avvicinati alla media del ruolo se ha giocato poco, e riportati ai gialli attesi per la sua squadra. Il marcatore è stimato dai suoi tiri in porta attesi e dai gol attesi della squadra (nei dati non ci sono i gol dei singoli giocatori). Le icone sul campo segnano chi spicca in ogni squadra.</p>
<h2>Simulazione «Scopri chi segnerà»</h2>
<p>È una partita animata costruita sul pronostico: finisce con l'esito più probabile (1, X o 2) e con un numero di gol vicino a quelli attesi, segnano i marcatori più probabili e durante la partita si scopre chi riceverà il cartellino, chi farà e subirà fallo e chi tirerà di più. Serve a vedere la stima in modo immediato, non è una previsione certa.</p>
<h2>Multigol, combo, esatti, corner e primo tempo</h2>
<p>Multigol, combo e risultato esatto sono calcolati sulla griglia dei punteggi del modello. Corner 1X2 e handicap sulle distribuzioni dei corner delle due squadre. Il primo tempo è una stima approssimata: nei dati non ci sono i gol per tempo, quindi conta il 45% dei gol attesi nel primo tempo.</p>
<h2>Verifica delle giocate</h2>
<p>Test in avanti su 26.396 partite di 18 campionati dal 2022, usando per ogni partita solo i dati precedenti. Nelle giocate che l'app mostra (dal 50% in su), previsto contro uscito: multigol 69,7% → 70,4%, combo esito + under/over 59,4% → 58,6%, segna sì/no 71,7% → 72,8%, corner 1X2 62,0% → 61,1%, handicap corner 71,3% → 70,0%, linee di corner 69,5% → 69,6%, linee di cartellini 75,7% → 76,5%. Goal/no goal era troppo estremo ed è stato corretto; le combo con goal/no goal sono state tolte perché non reggevano.</p>
<p>Giallo del singolo giocatore: test su 37.683 giocatori-partita di questa stagione. È molto casuale: in media lo prende un titolare su 7, e il più a rischio di ogni squadra circa uno su 6. Marcatore e primo tempo non si possono verificare con questi dati.</p>
<h2>Champions, Europa e Conference League</h2>
<p>Nelle coppe si affrontano squadre di campionati diversi: la forza di ogni squadra si stima insieme su coppe, preliminari e tutti i campionati dell'app, così le partite europee collegano un campionato all'altro. Per le squadre di campionati che l'app non segue (per esempio Repubblica Ceca, Croazia, Azerbaigian) contano solo le partite europee, quindi la stima è più incerta.</p>
<p>Test in avanti su 1.952 partite di coppa dal 2023 (1.494 nella fase principale), usando ogni volta solo i dati precedenti. Fase principale, previsto contro uscito: esito 1X2 65,2% → 65,9%, under/over gol 75,9% → 75,5%, segna sì/no 74,0% → 74,2%, multigol 69,2% → 69,5%, combo 60,6% → 59,9%, linee di tiri 66,3% → 66,1%, tiri in porta 70,1% → 69,6%, corner 68,5% → 68,9%, falli 69,2% → 69,3%, cartellini 75,5% → 75,4%. Goal/no goal è la giocata più debole: 55,3% → 53,0%. In Champions ed Europa League i favoriti vincono più spesso che in campionato, in Conference no: il calcolo ne tiene conto. Giocatori: provati su 140 partite di coppa del 2025-26, con percentuali in linea con i campionati.</p>
<p>Nei preliminari alcune partite hanno statistiche sbagliate nella fonte (tiri uguali ai gol, falli e corner a zero): quelle non vengono usate.</p>
<h2>Cosa non fa</h2>
<ul>
<li>L'arbitro non entra nel calcolo: nella prova sui dati non migliorava le previsioni sui cartellini.</li>
<li>Infortuni e squalifiche non arrivano in automatico: usa il pulsante di stato del giocatore.</li>
<li>Le assenze cambiano i numeri dei giocatori, non quelli di squadra.</li>
<li>Le coppe nazionali (Coppa Italia, FA Cup…) non ci sono.</li>
<li>Serie C, Svizzera, Polonia, Romania, Croazia e Repubblica Ceca non ci sono: la fonte dei dati non ha tiri, corner e falli per quei campionati.</li>
<li>Nei campionati equilibrati (Serie B, 2. Bundesliga) le squadre si somigliano e il modello aggiunge poco rispetto alla media del campionato. In Olanda, Scozia, Portogallo e Grecia, dove le grandi dominano, aggiunge molto.</li>
<li>Austria, Danimarca, Norvegia, Svezia, Brasile, Argentina e MLS hanno meno storico alle spalle: li ho provati solo sulle partite 2025-26, dove le percentuali tornano come negli altri campionati.</li>
<li>Per le nazionali i dati sono pochi e le stime più incerte.</li>
<li>I dati arrivano da fonti pubbliche non ufficiali: se cambiano, l'app può smettere di aggiornarsi.</li>
</ul>
<p class="foot">Solo per maggiorenni. Gioca responsabilmente e mai più di quanto puoi permetterti di perdere.</p>
